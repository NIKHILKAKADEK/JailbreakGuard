<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f8fc" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('jailbreakguard-theme');
          const theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0b1020' : '#f5f7fb';
        } catch { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
    <meta name="description" content="A local, rule-based prompt security review workspace." />
    <title>JailbreakGuard | Prompt Security</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
